[options]
admin_passwd = ${ODOO_ADMIN_PASSWORD}
db_host = db
db_port = 5432
db_user = ${POSTGRES_USER}
db_password = ${POSTGRES_PASSWORD}
dbfilter = ^odoo$
db_name = odoo
proxy_mode = True
http_port = 8069
gevent_port = 8072
workers = 2
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
list_db = False
data_dir = /var/lib/odoo
addons_path = /opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/extra-addons,/mnt/enterprise
log_level = info
zoom_account_id = ${ZOOM_ACCOUNT_ID}
zoom_client_id = ${ZOOM_CLIENT_ID}
zoom_client_secret = ${ZOOM_CLIENT_SECRET}
zoom_secret_token = ${ZOOM_SECRET_TOKEN}
zoom_host_email = ${ZOOM_HOST_EMAIL}
