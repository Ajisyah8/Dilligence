services:
  db:
    image: postgres:16-alpine
    container_name: dilligence-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dilligence-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dilligence-odoo
    depends_on:
      db:
        condition: service_healthy
    environment:
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET}
      ZOOM_SECRET_TOKEN: ${ZOOM_SECRET_TOKEN}
      ZOOM_HOST_EMAIL: ${ZOOM_HOST_EMAIL:-}
      VIRTUAL_HOST: ${ODOO_DOMAIN}
      LETSENCRYPT_HOST: ${ODOO_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      VIRTUAL_PORT: 8069
    expose:
      - "8069"
      - "8072"
    ports:
      - "127.0.0.1:${ODOO_LOCAL_PORT}:8069"
    volumes:
      - dilligence-odoo:/var/lib/odoo
      - ./custom-addons:/mnt/extra-addons/custom:ro
      - ./enterprise:/mnt/enterprise:ro
    networks:
      - default
      - proxy_default
    restart: unless-stopped

volumes:
  dilligence-postgres:
  dilligence-odoo:

networks:
  proxy_default:
    external: true
