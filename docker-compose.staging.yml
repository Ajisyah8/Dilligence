services:
  db:
    image: postgres:16-alpine
    container_name: diligence-staging-db
    environment:
      POSTGRES_DB: diligence_staging
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - diligence-staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d diligence_staging"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
    restart: unless-stopped

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diligence-staging-odoo
    depends_on:
      db:
        condition: service_healthy
    environment:
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET}
      ZOOM_SECRET_TOKEN: ${ZOOM_SECRET_TOKEN}
      ZOOM_HOST_EMAIL: ${ZOOM_HOST_EMAIL:-}
      VIRTUAL_HOST: diligence.arusdigital.cloud
      LETSENCRYPT_HOST: diligence.arusdigital.cloud
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      VIRTUAL_PORT: 8069
    expose:
      - "8069"
      - "8072"
    ports:
      - "127.0.0.1:28069:8069"
    volumes:
      - diligence-staging-odoo:/var/lib/odoo
      - ./custom-addons:/mnt/extra-addons/custom:ro
      - ./addons:/mnt/extra-addons/latest:ro
      - ./docker/odoo.staging.conf:/etc/odoo/odoo.conf:ro
      - ./enterprise:/mnt/enterprise:ro
    networks:
      - default
      - proxy_default
    restart: unless-stopped

volumes:
  diligence-staging-postgres:
  diligence-staging-odoo:

networks:
  proxy_default:
    external: true
