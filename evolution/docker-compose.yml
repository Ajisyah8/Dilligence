services:
  postgres:
    image: postgres:16-alpine
    container_name: diligence-evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME}
      POSTGRES_USER: ${EVOLUTION_DB_USER}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: diligence-evolution-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
    ports:
      - "127.0.0.1:14400:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      VIRTUAL_HOST: wa.diligence.arusdigital.cloud
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: wa.diligence.arusdigital.cloud
      LETSENCRYPT_EMAIL: gilaorgila@gmail.com
    networks:
      - proxy_default
      - default

volumes:
  evolution_instances:
  evolution_postgres:

networks:
  proxy_default:
    external: true
